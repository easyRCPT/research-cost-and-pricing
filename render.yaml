# Render Blueprint — deploy Django API + Vite SPA to Render, Postgres on Neon.
#
# How to use:
#   1. Create the database in the Neon dashboard first and copy its connection
#      string (Connect -> pooled connection string, ?sslmode=require).
#   2. In Render: New -> Blueprint, connect the GitHub repo, pick the branch.
#   3. When prompted, paste the Neon connection string into DATABASE_URL.
#
services:
  # ------------------------------------------------------------------
  # Django API (Gunicorn + Whitenoise). Postgres lives on Neon.
  # ------------------------------------------------------------------
  - type: web
    name: easyrcpt-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --noinput && uv run python manage.py migrate && uv run python manage.py seed
    # One worker on purpose: the lookup cache is per-process, so a second
    # worker doubles cold loads and serves stale lookups after an admin edit.
    startCommand: uv run gunicorn config.wsgi:application --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Hardcoded, not fromService: a service cannot resolve its own hostname
      # at creation time, and api <-> web references form a cycle.
      - key: DJANGO_ALLOWED_HOSTS
        value: easyrcpt-api.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://easyrcpt.onrender.com
      # Prompted for during Blueprint setup: paste the Neon pooled URL here.
      - key: DATABASE_URL
        sync: false

  # ------------------------------------------------------------------
  # Vite/React single-page app (static site, assets served by Render).
  # ------------------------------------------------------------------
  - type: web
    name: easyrcpt
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://easyrcpt-api.onrender.com
