# Render Blueprint — deploy Django API + Vite SPA to Render, Postgres on Neon.
#
# How to use:
#   1. Create the database in the Neon dashboard first and copy its connection
#      string (Connect -> pooled connection string, ?sslmode=require).
#   2. In Render: New -> Blueprint, connect the GitHub repo, pick the branch.
#   3. When prompted, paste the Neon connection string into DATABASE_URL.
#
# If you rename a service below, also update the two hostname env vars that
# point at it (DJANGO_ALLOWED_HOSTS / DJANGO_CORS_ALLOWED_ORIGINS / VITE_API_URL).

services:
  # ------------------------------------------------------------------
  # Django API (Gunicorn + Whitenoise). Postgres lives on Neon.
  # ------------------------------------------------------------------
  - type: web
    name: rcpt-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --noinput
    preDeployCommand: uv run python manage.py migrate && uv run python manage.py seed
    startCommand: uv run gunicorn config.wsgi:application --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: rcpt-api.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://rcpt-web.onrender.com
      # Prompted for during Blueprint setup: paste the Neon pooled URL here.
      - key: DATABASE_URL
        sync: false

  # ------------------------------------------------------------------
  # Vite/React single-page app (static site, assets served by Render).
  # ------------------------------------------------------------------
  - type: web
    name: rcpt-web
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rcpt-api.onrender.com