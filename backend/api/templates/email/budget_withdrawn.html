<!DOCTYPE html>

<head>

  <title>Budget Withdrawn</title>
</head>
<body>
<p>
  A budget waiting on your review has been <strong>withdrawn</strong> by its owner.
</p>

<p>
  <strong>Project:</strong>
  {{ budget.project.title }}
</p>

<p>

</p>

<p>
  <a href="{{ url }}">Open RCPT</a>
</p>

</body>
</html>
