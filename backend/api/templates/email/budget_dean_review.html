<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Budget Review Required</title>
</head>
<body>
<p>
  A budget requires <strong>Dean</strong> review.
</p>

<p>
  <strong>Project:</strong>
  {{ budget.project.title }}
</p>

<p>
  <strong>Department:</strong>
  {{ budget.project.department.name }}
</p>

<p>
  <strong>Dean approval is required because:</strong>
</p>

<ul>
  {% for trigger in triggers %}
    <li>{{ trigger }}</li>
  {% endfor %}
</ul>

<p>
  <a href="{{ url }}">Open budget</a>
</p>

</body>
</html>
