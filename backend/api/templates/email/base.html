<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background:#f2f2f4; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color:#1f1f1f;">
  {# Tables and inline styles: most mail clients drop <style> and ignore flexbox. #}
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f4;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
          <tr>
            <td style="padding:0 4px 16px; font-size:15px; font-weight:700; color:#10234a; letter-spacing:-0.01em;">easyRCPT</td>
          </tr>
          <tr>
            <td style="background:#ffffff; border:1px solid #e4e4e7; border-radius:12px; padding:32px;">
              <h1 style="margin:0 0 8px; font-size:20px; line-height:1.3; font-weight:600; color:#10234a;">{% block heading %}{% endblock %}</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.5; color:#3f3f46;">{% block intro %}{% endblock %}</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px; line-height:1.5; border-top:1px solid #e4e4e7;">
                <tr>
                  <td style="padding:10px 0; width:150px; color:#64707f; border-bottom:1px solid #e4e4e7;">Project</td>
                  <td style="padding:10px 0; font-weight:600; border-bottom:1px solid #e4e4e7;">{{ title }}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0; color:#64707f; border-bottom:1px solid #e4e4e7;">Department</td>
                  <td style="padding:10px 0; border-bottom:1px solid #e4e4e7;">{{ project.department.name|default:"—" }}</td>
                </tr>
                {% if project.chief_investigator %}
                <tr>
                  <td style="padding:10px 0; color:#64707f; border-bottom:1px solid #e4e4e7;">Chief investigator</td>
                  <td style="padding:10px 0; border-bottom:1px solid #e4e4e7;">{{ project.chief_investigator }}</td>
                </tr>
                {% endif %}
                <tr>
                  <td style="padding:10px 0; color:#64707f; border-bottom:1px solid #e4e4e7;">Submitted by</td>
                  <td style="padding:10px 0; border-bottom:1px solid #e4e4e7;">{{ project.created_by.display_name }}</td>
                </tr>
              </table>

              {% block body %}{% endblock %}

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:28px;">
                <tr>
                  <td style="background:#10234a; border-radius:8px;">
                    <a href="{{ url }}" style="display:inline-block; padding:12px 20px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">{% block button %}Open the costing{% endblock %}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 4px 0; font-size:12px; line-height:1.5; color:#64707f;">
              {% block footer %}{% endblock %}<br>
              If the button doesn't work, paste this into your browser: <a href="{{ url }}" style="color:#64707f;">{{ url }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
