[project]
name = "rcpt-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.30.0",
    "drf-standardized-errors[openapi]>=0.16.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.9.0",
]

[dependency-groups]
# Not django-types: it unpacks over the same django-stubs/ directory, so
# whichever installs last wins and Pyright sees a different set of symbols.
dev = [
    "django-stubs>=6.1.0",
    "openpyxl>=3.1.5",
]

[tool.ruff]
# Django migrations are generated code and are not linted
exclude = [
    "api/migrations",
]

[tool.ruff.lint]
# RUF012 is not suitable for Django model Meta declarations.
ignore = ["RUF012"]
